services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartgrid-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 40s
      retries: 10
      start_period: 30s

  account-service:
    build:
      context: .
      args:
        SERVICE_NAME: account-service
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  node-manager:
    build:
      context: .
      args:
        SERVICE_NAME: node-manager
    container_name: node-manager
    ports:
      - "8082:8082"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka

  measurement-service:
    build:
      context: .
      args:
        SERVICE_NAME: measurement-service
    container_name: measurement-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_PROFILES_ACTIVE=simulator
    depends_on:
      - kafka

  billing-service:
    build:
      context: .
      args:
        SERVICE_NAME: billing-service
    container_name: billing-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka

  presentation-service:
    build:
      context: .
      args:
        SERVICE_NAME: presentation-service
    container_name: presentation-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka

  analytics-service:
    image: apache/spark:3.5.3-java17-python3
    container_name: analytics-service
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INPUT_TOPIC=measurement-events
      - OUTPUT_WINDOW_TOPIC=district-window-stats
      - OUTPUT_SOC_TOPIC=district-soc-state
      - CHECKPOINT_DIR=/opt/spark/work-dir/analytics_checkpoint
    volumes:
      - ./analytics-service/target:/app/target:ro
      - ${HOME}/.m2/repository:/m2:ro
      - ./analytics-service/checkpoint:/opt/spark/work-dir/analytics_checkpoint
    command: ["/opt/spark/bin/spark-submit","--jars","/m2/org/apache/spark/spark-sql-kafka-0-10_2.12/3.5.0/spark-sql-kafka-0-10_2.12-3.5.0.jar,/m2/org/apache/spark/spark-token-provider-kafka-0-10_2.12/3.5.0/spark-token-provider-kafka-0-10_2.12-3.5.0.jar,/m2/org/apache/kafka/kafka-clients/3.8.1/kafka-clients-3.8.1.jar,/m2/org/apache/commons/commons-pool2/2.12.1/commons-pool2-2.12.1.jar","--class","com.smartgrid.analytics.AnalyticsEngine","/app/target/analytics-service-0.0.1-SNAPSHOT.jar"]

  simulation-service:
    build:
      context: ..
      dockerfile: SmartGrid/simulation-service/Dockerfile
    container_name: simulation-service
    ports:
      - "8086:8086"
    environment:
      - SIMULATION_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
